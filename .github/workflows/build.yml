name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release (tag v<version from package.json>)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Desktop smoke test
        run: |
          npm run build
          xvfb-run -a node tests/electron/smoke.mjs

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon and Intel: .dmg and .zip, ad-hoc signed (no Apple Developer ID).
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Linux packaging tools (rpm, Flatpak runtime 24.08)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No paid certificates: Windows build is unsigned, macOS build is ad-hoc signed.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: veil-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.flatpak
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA-256 checksums and release notes
        run: |
          shopt -s nullglob
          cd dist
          files=(*.exe *.zip *.AppImage *.deb *.rpm *.flatpak *.dmg)
          sha256sum -- "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          # The notes are this version's section of CHANGELOG.md, plus how to check the files.
          version="${{ steps.version.outputs.tag }}"
          awk -v v="## ${version#v}" '/^## / { on = index($0, v) == 1; next } on' CHANGELOG.md > notes.md
          printf '\n### Проверка файлов\n\nКонтрольные суммы — в `SHA256SUMS.txt`. Linux: `sha256sum -c SHA256SUMS.txt --ignore-missing`; Windows (PowerShell): `Get-FileHash .\\Veil-*-setup.exe`.\n' >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          # A manual run creates the tag from package.json on the built commit.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Veil ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          files: dist/*
          body_path: notes.md
