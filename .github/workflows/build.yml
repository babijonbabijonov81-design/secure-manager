name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release (tag v<version from package.json>)
        type: boolean
        default: false
      platforms:
        description: >-
          Which systems to build. «windows» publishes a pre-release with Windows only (to try it
          first); «mac-linux» then adds macOS and Linux to the same release and makes it final.
        type: choice
        options: [all, windows, mac-linux]
        default: all

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Desktop smoke test
        run: |
          npm run build
          xvfb-run -a node tests/electron/smoke.mjs

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        run: |
          # Apple Silicon and Intel: .dmg and .zip, ad-hoc signed (no Apple Developer ID).
          mac='{"os":"macos-latest","target":"--mac"}'
          win='{"os":"windows-latest","target":"--win"}'
          linux='{"os":"ubuntu-latest","target":"--linux"}'
          case "${{ inputs.platforms }}" in
            windows) list="[$win]" ;;
            mac-linux) list="[$mac,$linux]" ;;
            *) list="[$mac,$win,$linux]" ;;
          esac
          echo "matrix={\"include\":$list}" >> "$GITHUB_OUTPUT"

  package:
    needs: [test, plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Linux packaging tools (rpm, Flatpak runtime 24.08)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08
      - run: npm run build
        env:
          # «Копия в OneDrive»: the Microsoft Entra application (client) ID, a repository variable
          # (Settings → Secrets and variables → Actions → Variables). Not a secret; empty = feature hidden.
          VEIL_MS_CLIENT_ID: ${{ vars.VEIL_MS_CLIENT_ID }}
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No paid certificates: Windows build is unsigned, macOS build is ad-hoc signed.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: veil-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.flatpak
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA-256 checksums and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # Adding systems to a release that already has some: keep the checksums already there.
          gh release download "${{ steps.version.outputs.tag }}" -p SHA256SUMS.txt -O previous-sums.txt 2>/dev/null || : > previous-sums.txt
          cd dist
          files=(*.exe *.zip *.AppImage *.deb *.rpm *.flatpak *.dmg)
          sha256sum -- "${files[@]}" > new-sums.txt
          # A file built again replaces its old line.
          awk 'NR == FNR { seen[$2] = 1; print; next } !($2 in seen)' new-sums.txt ../previous-sums.txt | sort -k2 > SHA256SUMS.txt
          rm new-sums.txt
          cat SHA256SUMS.txt
          cd ..
          # The notes are this version's section of CHANGELOG.md, plus how to check the files.
          version="${{ steps.version.outputs.tag }}"
          awk -v v="## ${version#v}" '/^## / { on = index($0, v) == 1; next } on' CHANGELOG.md > notes.md
          printf '\n### Проверка файлов\n\nКонтрольные суммы — в `SHA256SUMS.txt`. Linux: `sha256sum -c SHA256SUMS.txt --ignore-missing`; Windows (PowerShell): `Get-FileHash .\\Veil-*-setup.exe`.\n' >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          # A manual run creates the tag from package.json on the built commit.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Veil ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          files: dist/*
          body_path: notes.md
          # Windows alone is a pre-release: the updaters on macOS and Linux keep to the last full one.
          prerelease: ${{ inputs.platforms == 'windows' }}
          make_latest: ${{ inputs.platforms != 'windows' }}
