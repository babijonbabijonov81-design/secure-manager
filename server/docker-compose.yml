# Сервер Veil + автоматический HTTPS (Caddy) + необязательный TURN для звонков.
# Пошаговая инструкция: README.md → «Вариант 3. Свой VPS с HTTPS».
# Настройки берутся из файла .env рядом с этим файлом:
#   DOMAIN=chat.example.com                      домен, который указывает на этот сервер (обязательно)
#   TURN_SECRET=...  TURN_URLS=turn:chat.example.com:3478   TURN для звонков (по желанию)
#   BREVO_API_KEY=...  MAIL_FROM=Veil <you@example.com>     почта для восстановления (по желанию)
# Запуск: docker compose --profile turn up -d   (без TURN: docker compose up -d)
# Для TURN откройте порты 3478 (UDP и TCP) и 49160–49200 (UDP).
services:
  relay:
    build: .
    restart: unless-stopped
    environment:
      - BREVO_API_KEY
      - RESEND_API_KEY
      - SMTP_URL
      - MAIL_FROM
      - TURN_URLS
      - TURN_SECRET
    volumes:
      - relay-data:/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN} --to relay:8787
    volumes:
      - caddy-data:/data
  turn:
    image: coturn/coturn:4.6
    profiles: [turn]
    restart: unless-stopped
    network_mode: host
    command: >
      -n --log-file=stdout --no-cli --fingerprint
      --use-auth-secret --static-auth-secret=${TURN_SECRET:-} --realm=${DOMAIN:-veil}
      --listening-port=3478 --min-port=49160 --max-port=49200
      --no-multicast-peers --no-loopback-peers
      --denied-peer-ip=10.0.0.0-10.255.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255 --denied-peer-ip=192.168.0.0-192.168.255.255
volumes:
  relay-data:
  caddy-data:
