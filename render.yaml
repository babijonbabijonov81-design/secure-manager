# Сервер Veil на Render (https://render.com) в один клик: New → Blueprint → этот репозиторий.
services:
  - type: web
    name: veil-relay
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: memory
      - key: RELAY_NAME
        value: Veil Relay
      # Render's proxy adds the visitor's address to X-Forwarded-For: limits per IP use it.
      - key: TRUST_PROXY
        value: '1'
      # The server's own key (and id) stays the same across restarts; Render makes up the value.
      - key: SERVER_SECRET
        generateValue: true
      # Tunnels for Veil servers at home behind NAT. The free plan has 100 GB of traffic a month:
      # at most 20 tunnels, 500 MB a day each (change or set TUNNELS=0 to turn tunnels off).
      - key: TUNNELS_MAX
        value: '20'
      - key: TUNNEL_MB_PER_DAY
        value: '500'
      # Почта для кодов восстановления (по желанию). Brevo работает на бесплатном Render:
      # создайте API-ключ на brevo.com и укажите адрес отправителя, подтверждённый там.
      # Звонки на Render работают без настройки; TURN здесь запустить нельзя (нет UDP).
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
