# Сервер Veil на Render (https://render.com) в один клик: New → Blueprint → этот репозиторий.
services:
  - type: web
    name: veil-relay
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: memory
      - key: RELAY_NAME
        value: Veil Relay
      # Почта для кодов восстановления (по желанию). Brevo работает на бесплатном Render:
      # создайте API-ключ на brevo.com и укажите адрес отправителя, подтверждённый там.
      # Звонки на Render работают без настройки; TURN здесь запустить нельзя (нет UDP).
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
