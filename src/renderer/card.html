<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP is injected at build time (see electron.vite.config.mts) -->
    <title>Veil</title>
  </head>
  <body>
    <div id="card" class="card" role="button" tabindex="-1">
      <div class="avatar"><span id="initials"></span><i class="badge"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M7 9 Q19 10 24 39 Q11 29 7 9 Z" fill="#FF7A45"/><path d="M41 9 Q29 10 24 39 Q37 29 41 9 Z" fill="#3DDC97" opacity="0.92"/><circle cx="24" cy="14" r="4.2" fill="#F4EFE9"/></svg></i></div>
      <div class="content">
        <div class="head"><b id="title"></b><span class="time">сейчас</span></div>
        <div id="body" class="body"></div>
      </div>
      <div id="actions" class="actions" hidden>
        <button id="decline" class="act decline" aria-label="Отклонить" title="Отклонить">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.956.956 0 0 1 0-1.36C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.72c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28a11.27 11.27 0 0 0-2.67-1.85.996.996 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
        </button>
        <button id="accept" class="act accept" aria-label="Ответить" title="Ответить">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
        </button>
      </div>
      <button id="close" class="close" aria-label="Закрыть">✕</button>
      <div class="timer"><div id="bar"></div></div>
    </div>
    <script type="module" src="./src/card.ts"></script>
  </body>
</html>
