appId: app.veil.messenger
productName: Veil
copyright: Copyright © 2026 Veil
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - resources/**/*
  - package.json
  - '!**/*.map'
asar: true
artifactName: Veil-${version}-${os}-${arch}.${ext}
# veil:// invite links. Linux: MimeType=x-scheme-handler/veil in the .desktop file (deb, rpm,
# Flatpak); Windows: registered by the app itself for the current user (installer and portable).
protocols:
  - name: Veil invite
    schemes: [veil]

mac:
  category: public.app-category.social-networking
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Ad-hoc signature: required for Apple Silicon. For distribution without warnings,
  # replace with a "Developer ID Application" identity and enable notarization.
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    NSHumanReadableCopyright: Veil — end-to-end encrypted messenger
    NSMicrophoneUsageDescription: Veil records voice messages only when you press the microphone button.
    NSCameraUsageDescription: Veil uses the camera only to scan a veil:// invite QR code.
dmg:
  title: Veil ${version}
  artifactName: Veil-${version}-mac-${arch}.${ext}
  contents:
    - x: 140
      y: 190
    - x: 400
      y: 190
      type: link
      path: /Applications

win:
  icon: build/icon.ico
  # Installer and portable .zip, each for x64 and ARM64 (Windows 10 21H2+ and 11).
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Veil
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerLanguages: [ru_RU, en_US]
  multiLanguageInstaller: true
  # One installer per architecture; the in-app updater picks the one for this PC.
  buildUniversalInstaller: false
  artifactName: Veil-${version}-win-${arch}-setup.${ext}

linux:
  icon: build/icons
  category: Network
  # AppImage updates itself; .deb, .rpm and Flatpak are updated through the package manager.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
    - target: flatpak
      arch: [x64]
  maintainer: Veil
  synopsis: End-to-end encrypted messenger
  description: Мессенджер со сквозным шифрованием
flatpak:
  runtime: org.freedesktop.Platform
  runtimeVersion: '24.08'
  sdk: org.freedesktop.Sdk
  base: org.electronjs.Electron2.BaseApp
  baseVersion: '24.08'
  finishArgs:
    - --share=ipc
    - --share=network
    - --socket=x11
    - --socket=wayland
    - --socket=pulseaudio
    # GPU, microphone and camera (video calls, scanning a veil:// QR code).
    - --device=all
    # Saved files; other folders through the system file chooser (portal).
    - --filesystem=xdg-download
    - --talk-name=org.freedesktop.Notifications
    - --talk-name=org.kde.StatusNotifierWatcher
    # Quick unlock keeps its key in the system keychain.
    - --talk-name=org.freedesktop.secrets
    # Locking together with the system.
    - --talk-name=org.freedesktop.ScreenSaver
    - --talk-name=org.gnome.ScreenSaver
    - --system-talk-name=org.freedesktop.login1

# In-app updates read releases from this repository (it must be public for that).
publish:
  provider: github
  owner: babijonbabijonov81-design
  repo: secure-manager
  releaseType: release
